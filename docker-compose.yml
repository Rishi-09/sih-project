# ═══════════════════════════════════════════════════════════════════════════════
# SIH Project — Self-Hosted Stack (No Railway Required)
#
# Runs all 4 services + Nginx reverse proxy on a single machine.
# Access via http://<machine-ip> from any phone or PC on the network.
#
# Quick start:
#   docker compose up -d --build
#
# To expose publicly (phone access outside LAN):
#   - Use a free Cloudflare Tunnel, or
#   - Set up port-forwarding on your router for port 80/443, or
#   - Run on any $5/month VPS (DigitalOcean, Hetzner, etc.)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── 1. Retribution Physics Simulator (Python, WebSocket on 8766) ──────────
  simulator:
    build: ./retribution
    container_name: r2-simulator
    restart: unless-stopped
    environment:
      - PORT=8766
    expose:
      - "8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio, websockets; asyncio.run(websockets.connect('ws://localhost:8766').__aenter__())"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── 2. Node.js Twin Server (Express + Socket.IO on 4000) ──────────────────
  server:
    build: ./server
    container_name: r2-server
    restart: unless-stopped
    depends_on:
      simulator:
        condition: service_healthy
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:///app/data/twin.db
      - CORS_ORIGIN=http://localhost:3000,http://localhost,http://web:3000
      - OPS_WS_URL=ws://simulator:8766
      # Optional — fill these in .env file for AI advisory & ML features:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - ML_API_URL=${ML_API_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-sih-twin-alerts}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - server-data:/app/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 3. Next.js Web Frontend (on 3000) ─────────────────────────────────────
  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_API_BASE=
    container_name: r2-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE=
      - NODE_ENV=production
    expose:
      - "3000"

  # ── 4. Nginx Reverse Proxy (single entry point on port 80) ────────────────
  #
  # Routes:
  #   /           → Next.js web (port 3000)
  #   /api/*      → Node.js server (port 4000)
  #   /socket.io/ → Node.js server WebSocket upgrade (port 4000)
  #
  # This is what phones/browsers connect to. One URL for everything.
  proxy:
    image: nginx:alpine
    container_name: r2-proxy
    restart: unless-stopped
    depends_on:
      - web
      - server
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── 5. Watchdog — Auto-restart + Webhook Alerts ───────────────────────────
  #
  # Pings all services every 30s. If a service is down, Docker auto-restarts
  # it (restart: unless-stopped), and the watchdog fires a webhook to your
  # phone (Discord, Telegram, Slack, email, or any URL you configure).
  watchdog:
    build: ./deploy/watchdog
    container_name: r2-watchdog
    restart: unless-stopped
    depends_on:
      - server
      - web
      - simulator
    environment:
      - CHECK_INTERVAL=30
      - SERVER_URL=http://server:4000/api/health
      - WEB_URL=http://web:3000
      - NTFY_TOPIC=${NTFY_TOPIC:-sih-twin-alerts}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # For Discord: https://discord.com/api/webhooks/...
      # For Telegram: https://api.telegram.org/bot<TOKEN>/sendMessage?chat_id=<ID>&text=
      # For Slack: https://hooks.slack.com/services/...

volumes:
  server-data:
    driver: local
