# ═══════════════════════════════════════════════════════════════════════════════
# SIH Project — Self-Hosted Production Stack for Your Own Dedicated Server
#
# Runs all services containerized on your server:
#   • Retribution Aero Engine Physics Simulator (Python 3.11, WebSocket :8766)
#   • R2 UAV Engine ML Inference Microservice (FastAPI :8000)
#   • Node.js Twin Server (Express, Socket.IO, SQLite :4000)
#   • Next.js Web Frontend Operator Console (:3000)
#   • Nginx Reverse Proxy (Single entry point on Port 80 / 443)
#   • Watchdog (Health monitor with auto-restart and phone push alerts)
#
# One-command deployment on your server:
#   docker compose up -d --build
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── 1. Retribution Physics Simulator (Python, WebSocket on 8766) ──────────
  simulator:
    build: ./retribution
    container_name: r2-simulator
    restart: unless-stopped
    environment:
      - PORT=8766
    expose:
      - "8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio, websockets; asyncio.run(websockets.connect('ws://localhost:8766').__aenter__())"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── 2. Local ML Inference Microservice (FastAPI on 8000) ──────────────────
  ml:
    build: ./ML
    container_name: r2-ml
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 3. Node.js Twin Server (Express + Socket.IO on 4000) ──────────────────
  server:
    build: ./server
    container_name: r2-server
    restart: unless-stopped
    depends_on:
      simulator:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/twin.db
      - CORS_ORIGIN=http://localhost:3000,http://localhost,http://web:3000
      - OPS_WS_URL=ws://simulator:8766
      - ML_API_URL=http://ml:8000
      - NTFY_TOPIC=${NTFY_TOPIC:-sih-twin-alerts}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # Optional Groq LLM API Key (if provided in .env, falls back gracefully if blank)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - server-data:/app/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 4. Next.js Web Frontend Operator Console (on 3000) ─────────────────────
  web:
    build:
      context: ./web
      args:
        - NEXT_PUBLIC_API_BASE=
    container_name: r2-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE=
      - NODE_ENV=production
    expose:
      - "3000"

  # ── 5. Nginx Reverse Proxy (Single entry point on port 80) ─────────────────
  proxy:
    image: nginx:alpine
    container_name: r2-proxy
    restart: unless-stopped
    depends_on:
      - web
      - server
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── 6. Watchdog — Auto-restart & Phone Alerts ─────────────────────────────
  watchdog:
    build: ./deploy/watchdog
    container_name: r2-watchdog
    restart: unless-stopped
    depends_on:
      - server
      - web
      - simulator
      - ml
    environment:
      - CHECK_INTERVAL=30
      - SERVER_URL=http://server:4000/api/health
      - WEB_URL=http://web:3000
      - NTFY_TOPIC=${NTFY_TOPIC:-sih-twin-alerts}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}

volumes:
  server-data:
    driver: local
